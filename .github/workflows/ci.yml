name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l on every PHP file
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, curl, zip
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  tests:
    name: Tests + migrations (PHP ${{ matrix.php }}, MariaDB 11.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: agri_app
      APP_URL: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, curl, zip, iconv
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit (unit + integration)
        run: vendor/bin/phpunit
      - name: Migrations and seed from an empty database
        run: |
          php bin/migrate.php --fresh
          php bin/migrate.php --status
          php bin/seed.php
          php bin/seed.php --if-empty
      - name: End-to-end smoke test over HTTP
        env:
          APP_URL: http://127.0.0.1:8080
        run: |
          php -d log_errors=1 -d display_errors=0 -d error_log=/tmp/agritrack.log -S 127.0.0.1:8080 -t public > /dev/null 2>&1 &
          for i in $(seq 20); do curl -fs -o /dev/null http://127.0.0.1:8080/login.php && break; sleep 0.5; done
          SERVER_LOG=/tmp/agritrack.log tests/smoke.sh http://127.0.0.1:8080

  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t agritrack .

  docker-compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the app (up to 90s)
        run: |
          for i in $(seq 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login.php || true)
            [ "$code" = "200" ] && echo "App is up after ~$((i * 2))s" && exit 0
            sleep 2
          done
          echo "App did not return 200 on /login.php within 90s (last: $code)"
          exit 1
      - name: Pages return 200
        run: |
          for page in index.php login.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$page")
            echo "$page -> $code"
            [ "$code" = "200" ] || exit 1
          done
      - name: Demo buyer can log in
        run: |
          jar=$(mktemp)
          token=$(curl -s -c "$jar" -b "$jar" http://localhost:8080/login.php \
            | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p' | head -n1)
          [ -n "$token" ] || { echo "No csrf_token in login form"; exit 1; }
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -c "$jar" -b "$jar" \
            --data-urlencode "csrf_token=$token" \
            --data-urlencode "email=buyer@agritrack.test" \
            --data-urlencode "password=Demo@1234" \
            http://localhost:8080/login.php)
          echo "POST login.php -> $out"
          case "$out" in
            "302 "*dashboard.php) ;;
            *) echo "Expected a 302 to dashboard.php"; exit 1 ;;
          esac
      - name: Demo account password is locked (DEMO_MODE=1)
        env:
          B: http://localhost:8080
        run: tests/demo_lock.sh "$B"
      - name: Demo reset (bin/reset_demo.php)
        run: |
          if docker compose exec -T -e DEMO_MODE=0 app php bin/reset_demo.php; then
            echo "reset_demo.php ran with DEMO_MODE=0"; exit 1
          fi
          docker compose exec -T app sh -c 'touch public/uploads/stray.jpg public/uploads/avatars/a.png'
          docker compose exec -T app php bin/reset_demo.php
          left=$(docker compose exec -T app sh -c 'cd public/uploads && find . -mindepth 1 | sort | tr "\n" " "')
          echo "uploads after reset: $left"
          [ "$left" = "./.htaccess ./avatars ./disease_checks " ]
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login.php)
          [ "$code" = 200 ]
          tests/demo_lock.sh http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-prod:
    name: Docker Compose prod override (Caddy HTTPS)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - name: Create .env (DOMAIN=localhost gets a certificate from Caddy's local CA)
        run: |
          {
            echo "DOMAIN=localhost"
            echo "DB_PASS=$(openssl rand -hex 24)"
            echo "DB_ROOT_PASS=$(openssl rand -hex 24)"
          } > .env
      - name: Override file is valid
        run: $COMPOSE config --quiet
      - name: Start the stack
        run: $COMPOSE up -d --build
      - name: Wait for HTTPS (up to 90s)
        run: |
          for i in $(seq 45); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login.php || true)
            [ "$code" = "200" ] && echo "HTTPS is up after ~$((i * 2))s" && exit 0
            sleep 2
          done
          echo "No 200 from https://localhost/login.php within 90s (last: $code)"
          exit 1
      - name: Session cookie is Secure over HTTPS; HTTP redirects to HTTPS
        run: |
          cookie=$(curl -sk -D - -o /dev/null https://localhost/login.php | grep -i '^set-cookie: PHPSESSID')
          echo "$cookie"
          grep -qi '; secure' <<<"$cookie"
          grep -qi '; httponly' <<<"$cookie"
          redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost/login.php)
          echo "http://localhost/login.php -> $redirect"
          [[ "$redirect" == 30[18]\ https://localhost/login.php ]]
      - name: Only Caddy is published (no 8080, no 3306)
        run: |
          if curl -s -o /dev/null --max-time 3 http://localhost:8080/; then echo "app port 8080 is published"; exit 1; fi
          if (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null; then echo "database port 3306 is published"; exit 1; fi
          $COMPOSE ps --format '{{.Service}}: {{.Publishers}}'
      - name: Demo login works over HTTPS and the app sees the client IP, not Caddy's
        run: |
          jar=$(mktemp)
          token=$(curl -sk -c "$jar" -b "$jar" https://localhost/login.php \
            | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p' | head -n1)
          out=$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' -c "$jar" -b "$jar" \
            --data-urlencode "csrf_token=$token" -d email=buyer@agritrack.test \
            --data-urlencode password=Demo@1234 https://localhost/login.php)
          echo "POST login.php -> $out"
          [[ "$out" == "302 https://localhost/dashboard.php" ]]
          . ./.env
          logged=$($COMPOSE exec -T db mariadb -uroot -p"$DB_ROOT_PASS" -N agri_app \
            -e "SELECT ip_address FROM activity_log WHERE action = 'login' ORDER BY id DESC LIMIT 1")
          caddy=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$($COMPOSE ps -q caddy)")
          echo "login logged from $logged; Caddy is $caddy"
          [ -n "$logged" ] && [ "$logged" != "$caddy" ]
      - name: Container logs
        if: failure()
        run: $COMPOSE logs
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
