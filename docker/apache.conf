<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Only public/ is served; config.php, .env, migrations/ etc. sit above it.
    # The project-root .htaccess is only for XAMPP-style setups where the repo
    # folder is the document root. Here it would rewrite /x.php to
    # public/public/x.php (404), so overrides are switched off above public/.
    <Directory /var/www/html>
        AllowOverride None
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Trust X-Forwarded-Proto from a TLS-terminating proxy (Render, Railway, Caddy…)
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
